<!DOCTYPE html>
<html>
<head>
    <title>Flask Notes</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Flask Notes App</h1>

<form action="/add" method="POST">

<input
type="text"
name="note"
placeholder="Enter a note"
required>

<button>Add</button>

</form>

<ul>

{% for note in notes %}

<li>

{{ note }}

<a href="/delete/{{ loop.index0 }}">Delete</a>

</li>

{% endfor %}

</ul>

</body>
</html>
